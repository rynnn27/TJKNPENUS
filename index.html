<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJKN.io — Peta Belajar Jaringan Kabel &amp; Nirkabel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1C;
    --bg-elev:#111a2c;
    --bg-elev-2:#182238;
    --border:#25314a;
    --border-soft:#1b2439;
    --text:#e9edf6;
    --text-muted:#8b98b4;
    --text-dim:#5c6883;
    --jaringan:#22d3ee;
    --jaringan-dim:rgba(34,211,238,.14);
    --fiber:#fb923c;
    --fiber-dim:rgba(251,146,60,.14);
    --server:#34d399;
    --server-dim:rgba(52,211,153,.14);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,211,238,.08), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(251,146,60,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--jaringan);color:#001018;}
  :focus-visible{outline:2px solid var(--jaringan);outline-offset:2px;}

  .shell{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft);margin-bottom:36px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot-strand{display:flex;gap:3px;}
  .brand .dot-strand span{width:6px;height:6px;border-radius:50%;background:var(--fiber);box-shadow:0 0 8px var(--fiber);}
  .brand .dot-strand span:nth-child(2){background:var(--jaringan);box-shadow:0 0 8px var(--jaringan);}
  .brand .dot-strand span:nth-child(3){background:var(--server);box-shadow:0 0 8px var(--server);}
  .brand-text{font-family:'Space Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.02em;}
  .brand-text small{display:block;font-family:'Inter',sans-serif;font-weight:400;color:var(--text-muted);font-size:11px;letter-spacing:.03em;margin-top:1px;}
  nav.tabs{display:flex;gap:4px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:4px;}
  nav.tabs button{
    background:transparent;border:none;color:var(--text-muted);
    padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;
    letter-spacing:.01em;transition:all .15s ease;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:var(--bg-elev-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border);}

  h1,h2,h3{font-family:'Inter',sans-serif;margin:0;letter-spacing:-.01em;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}

  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px;}
  .hero h1{font-size:32px;font-weight:800;max-width:560px;line-height:1.15;}
  .hero p{color:var(--text-muted);margin-top:10px;max-width:480px;font-size:14.5px;line-height:1.6;}
  .ring-wrap{display:flex;align-items:center;gap:14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:14px 20px;}
  .ring-wrap .num{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;}
  .ring-wrap .lbl{font-size:11.5px;color:var(--text-muted);line-height:1.4;max-width:110px;}

  .lane{margin-bottom:34px;}
  .lane-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .lane-title{display:flex;align-items:center;gap:10px;}
  .lane-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .lane-title h3{font-size:16.5px;font-weight:700;}
  .lane-title .sub{font-size:12.5px;color:var(--text-muted);margin-top:1px;}
  .lane-pct{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-muted);}

  .track{position:relative;padding:6px 4px 26px;overflow-x:auto;}
  .track-line{position:absolute;left:26px;right:26px;top:29px;height:2px;background:var(--border);}
  .nodes{display:flex;gap:22px;position:relative;min-width:max-content;padding:0 4px;}
  .node{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:none;border:none;color:inherit;width:96px;flex-shrink:0;
    padding:0;position:relative;z-index:1;
  }
  .node-circle{
    width:52px;height:52px;border-radius:50%;
    background:var(--bg-elev);border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-weight:700;font-size:14px;color:var(--text-dim);
    transition:all .15s ease;
  }
  .node:hover .node-circle{transform:translateY(-2px);}
  .node.done .node-circle{color:#04131a;}
  .node-label{font-size:11.5px;text-align:center;color:var(--text-muted);line-height:1.35;}
  .node.done .node-label{color:var(--text);}

  .cat-pills{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .pill{
    border:1px solid var(--border);background:var(--bg-elev);color:var(--text-muted);
    padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;
  }
  .pill.active{color:var(--text);border-color:var(--pc);background:var(--pc-dim);}
  .pill .sw{width:7px;height:7px;border-radius:50%;background:var(--pc);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:22px;}
  .card{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s ease;
  }
  .card:hover{border-color:var(--border);}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
  .card-num{font-family:'Space Mono',monospace;font-size:12px;color:var(--pc);border:1px solid var(--pc);padding:2px 8px;border-radius:6px;}
  .badge-done{font-size:10.5px;font-family:'Space Mono',monospace;color:var(--server);background:var(--server-dim);padding:2px 8px;border-radius:6px;}
  .badge-extra{font-size:10.5px;font-family:'Space Mono',monospace;color:var(--fiber);background:var(--fiber-dim);padding:2px 8px;border-radius:6px;}
  .badge-file{font-size:10.5px;font-family:'Space Mono',monospace;color:var(--jaringan);background:var(--jaringan-dim);padding:2px 8px;border-radius:6px;}
  .card h4{font-size:15px;font-weight:700;line-height:1.35;}
  .card p{font-size:13px;color:var(--text-muted);line-height:1.55;margin:0;flex:1;}
  .card-actions{display:flex;gap:8px;margin-top:4px;}

  .btn{
    border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text);
    padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--pc);border-color:var(--pc);color:#04131a;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;justify-content:center;}
  .btn.sm{padding:7px 11px;font-size:12.5px;}
  .btn.disabled,.btn:disabled{opacity:.55;pointer-events:none;}

  .add-row{margin-top:4px;}

  .panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:24px;}
  .panel h3{font-size:15.5px;margin-bottom:4px;}
  .panel .hint{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field textarea,.field select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--jaringan);}
  .field .filehint{font-size:11.5px;color:var(--text-dim);margin-top:6px;}

  .overlay{position:fixed;inset:0;background:rgba(5,8,15,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;padding:26px;max-height:85vh;overflow-y:auto;}
  .modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:10px;}
  .modal-close{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;padding:2px 4px;}
  .modal .card-num{margin-bottom:10px;display:inline-block;}
  .modal h3{font-size:19px;margin-bottom:10px;}
  .modal p.desc{color:var(--text-muted);font-size:14px;line-height:1.65;margin-bottom:18px;}
  .modal .link-out{display:flex;align-items:center;gap:8px;color:var(--fiber);font-size:13.5px;font-weight:600;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  .file-box{border:1px dashed var(--border);border-radius:11px;padding:14px 16px;margin-bottom:6px;}
  .file-info{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;}
  .file-info .fname{color:var(--text);font-weight:600;}
  .file-info .fsize{color:var(--text-dim);font-size:11.5px;margin-left:6px;}
  .file-empty{font-size:12.5px;color:var(--text-muted);margin-bottom:10px;}
  label.file-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;}
  label.file-btn:hover{border-color:var(--text-dim);}
  label.file-btn.sm{padding:7px 11px;font-size:12.5px;}
  .uploading-txt{font-size:12.5px;color:var(--jaringan);}

  .quiz-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .qcard{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:12px;}
  .qcard .lane-icon{margin-bottom:2px;}
  .qcard h4{font-size:16px;}
  .qcard .score{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-muted);}
  .progressbar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--border-soft);}
  .progressbar > div{height:100%;border-radius:99px;}

  .quiz-run{max-width:560px;margin:0 auto;}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .quiz-meta .eyebrow{color:var(--pc);}
  .qtext{font-size:19px;font-weight:700;margin-bottom:20px;line-height:1.4;}
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .opt{
    text-align:left;background:var(--bg-elev);border:1px solid var(--border);border-radius:11px;
    padding:13px 16px;font-size:14px;display:flex;align-items:center;gap:12px;color:var(--text);width:100%;
  }
  .opt:hover{border-color:var(--text-dim);}
  .opt .k{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-dim);border:1px solid var(--border);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .opt.correct{border-color:var(--server);background:var(--server-dim);}
  .opt.wrong{border-color:#f87171;background:rgba(248,113,113,.12);}
  .opt.correct .k{border-color:var(--server);color:var(--server);}
  .opt.wrong .k{border-color:#f87171;color:#f87171;}
  .opt:disabled{cursor:default;}

  .result-hero{text-align:center;padding:36px 20px;}
  .result-hero .big{font-family:'Space Mono',monospace;font-size:52px;font-weight:700;}
  .result-hero p{color:var(--text-muted);margin-top:8px;}

  .empty{border:1px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  footer{text-align:center;color:var(--text-dim);font-size:12px;padding-top:30px;font-family:'Space Mono',monospace;}

  @media (max-width:640px){
    .hero{flex-direction:column;align-items:flex-start;}
    header.topbar{flex-direction:column;align-items:flex-start;}
    nav.tabs{width:100%;}
    nav.tabs button{flex:1;}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="dot-strand"><span></span><span></span><span></span></div>
      <div class="brand-text">TJKN.io<small>Teknologi Jaringan Kabel &amp; Nirkabel</small></div>
    </div>
    <nav class="tabs" id="mainNav"></nav>
  </header>
  <main id="app"></main>
  <footer>SMK PLUS PELITA NUSANTARA — TKJ · KURIKULUM MERDEKA</footer>
</div>

<script>
/* ===================== DATA ===================== */
const CATS = {
  jaringan:{name:'Jaringan', short:'Jaringan Kabel & Nirkabel', color:'var(--jaringan)', dim:'var(--jaringan-dim)',
    desc:'Dari alamat IP sampai VLAN', icon:iconNetwork},
  fiber:{name:'Fiber Optik', short:'Fiber Optik', color:'var(--fiber)', dim:'var(--fiber-dim)',
    desc:'Kabel kaca dari dasar sampai OTDR', icon:iconFiber},
  server:{name:'Server', short:'Server', color:'var(--server)', dim:'var(--server-dim)',
    desc:'Debian dari instalasi sampai website live', icon:iconServer}
};

const MATERIALS = [
  {id:'j1',cat:'jaringan',title:'Konsep Dasar IP Address',desc:'Struktur alamat IPv4, pembagian kelas, serta perbedaan network ID dan host ID.'},
  {id:'j2',cat:'jaringan',title:'Konsep Dasar Subnetting',desc:'Notasi CIDR, VLSM, dan cara menghitung jumlah subnet serta host yang tersedia.'},
  {id:'j3',cat:'jaringan',title:'Konfigurasi Dasar Jaringan',desc:'Pengalamatan perangkat, routing sederhana, dan pengujian koneksi antar host.'},
  {id:'j4',cat:'jaringan',title:'Konfigurasi Wireless',desc:'Pengaturan SSID, mode keamanan WPA2, dan penempatan access point.'},
  {id:'j5',cat:'jaringan',title:'Konfigurasi Hotspot Login',desc:'User profile, halaman login pengguna, dan manajemen batas bandwidth.'},
  {id:'j6',cat:'jaringan',title:'Konfigurasi VLAN',desc:'Segmentasi jaringan, trunk port, dan inter-VLAN routing.'},

  {id:'f1',cat:'fiber',title:'Dasar Fiber Optik',desc:'Struktur kabel, sifat cahaya, serta perbedaan single mode dan multi mode.',link:'https://rynnn27.github.io/mymikrotik/#modul-1'},
  {id:'f2',cat:'fiber',title:'Kabel & Konektor',desc:'Jenis kabel, kode warna, bentuk ferrule, dan cara identifikasi konektor.',link:'https://rynnn27.github.io/mymikrotik/#modul-2'},
  {id:'f3',cat:'fiber',title:'Alat Kerja & K3',desc:'Fungsi stripper, cleaver, splicer, dan alat pelindung diri saat bekerja.',link:'https://rynnn27.github.io/mymikrotik/#modul-3'},
  {id:'f4',cat:'fiber',title:'Fusion Splicing',desc:'Tahap persiapan, proses penyambungan, hingga proteksi sambungan.',link:'https://rynnn27.github.io/mymikrotik/#modul-4'},
  {id:'f5',cat:'fiber',title:'Perangkat Pasif',desc:'Mengenal OTB, ODP, splitter, dan teknik cable dressing yang rapi.',link:'https://rynnn27.github.io/mymikrotik/#modul-5'},
  {id:'f6',cat:'fiber',title:'Pengukuran Jaringan',desc:'Penggunaan VFL, OPM, dan cara menghitung link loss budget.',link:'https://rynnn27.github.io/mymikrotik/#modul-6'},
  {id:'f7',cat:'fiber',title:'Analisis OTDR',desc:'Membaca parameter, event, dan menentukan titik putus pada jalur fiber.',link:'https://rynnn27.github.io/mymikrotik/#modul-7'},
  {id:'f8',cat:'fiber',title:'Troubleshooting',desc:'Diagnosis gangguan, pembersihan konektor, dan perbaikan sambungan.',link:'https://rynnn27.github.io/mymikrotik/#modul-8'},

  {id:'s1',cat:'server',title:'Instalasi Debian',desc:'Langkah pemasangan sistem operasi Debian sebagai dasar server.'},
  {id:'s2',cat:'server',title:'Konfigurasi IP Static',desc:'Pengaturan alamat IP tetap pada antarmuka jaringan server.'},
  {id:'s3',cat:'server',title:'Konfigurasi Repositori Debian',desc:'Mengatur sumber paket agar instalasi software berjalan lancar.'},
  {id:'s4',cat:'server',title:'Konfigurasi SSH',desc:'Mengaktifkan dan mengamankan akses jarak jauh melalui SSH.'},
  {id:'s5',cat:'server',title:'Konfigurasi Web Server',desc:'Pemasangan dan pengaturan layanan web server di Debian.'},
  {id:'s6',cat:'server',title:'Membuat Website',desc:'Menyiapkan berkas situs sederhana agar dapat diakses dari web server.'},
];

/* ===================== QUIZ BANK (30 soal / kategori) ===================== */
const QUIZ = {
  jaringan:[
    {q:'IPv4 terdiri dari berapa bit?',opts:['32 bit','24 bit','16 bit','64 bit'],a:0},
    {q:'Format penulisan alamat IPv4 yang umum digunakan adalah?',opts:['Biner murni','Desimal bertitik','Heksadesimal','Oktal'],a:1},
    {q:'Alamat IP kelas C secara default menggunakan subnet mask?',opts:['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.128'],a:2},
    {q:'Alamat IP yang digunakan khusus untuk loopback adalah?',opts:['10.0.0.1','127.0.0.1','192.168.0.1','0.0.0.0'],a:1},
    {q:'Rentang alamat IP privat kelas C yang umum dipakai adalah?',opts:['1.0.0.0–9.255.255.255','172.16.0.0–172.31.255.255','192.168.0.0–192.168.255.255','224.0.0.0–239.255.255.255'],a:2},
    {q:'Notasi CIDR /28 berarti berapa bit digunakan untuk network?',opts:['24 bit','26 bit','28 bit','30 bit'],a:2},
    {q:'Berapa jumlah host valid pada subnet /30?',opts:['2','4','6','8'],a:0},
    {q:'VLSM (Variable Length Subnet Mask) digunakan untuk apa?',opts:['Membagi subnet dengan ukuran berbeda-beda','Mengganti default gateway','Menambah kecepatan wifi','Mengenkripsi data'],a:0},
    {q:'Subnet mask 255.255.255.192 setara dengan notasi CIDR?',opts:['/24','/26','/28','/30'],a:1},
    {q:'Alamat broadcast pada sebuah subnet digunakan untuk?',opts:['Mengirim data ke semua host di subnet tersebut','Menyimpan alamat gateway','Login ke router','Menyimpan alamat MAC'],a:0},
    {q:'Perintah yang umum dipakai untuk menguji koneksi antar host adalah?',opts:['ping','format','delete','install'],a:0},
    {q:'Default gateway berfungsi sebagai?',opts:['Jalur keluar menuju jaringan lain','Nama komputer','Alamat MAC','Server DNS'],a:0},
    {q:'Fungsi utama DNS dalam jaringan adalah?',opts:['Menerjemahkan nama domain ke alamat IP','Membagi bandwidth','Mengatur VLAN','Menyimpan password wifi'],a:0},
    {q:'DHCP digunakan untuk apa?',opts:['Memberikan alamat IP secara otomatis ke perangkat','Mengatur kecepatan CPU','Menghapus cache browser','Mengunci port switch'],a:0},
    {q:'Kabel yang umum digunakan untuk menghubungkan PC ke switch adalah?',opts:['UTP straight-through','UTP cross saja','Fiber single mode','Kabel coaxial'],a:0},
    {q:'SSID adalah?',opts:['Nama jaringan wireless yang terlihat oleh pengguna','Alamat MAC access point','Kata sandi wifi','Kode enkripsi data'],a:0},
    {q:'Mode keamanan wireless yang umum direkomendasikan adalah?',opts:['WEP','Tanpa password (open)','WPA2','Hidden SSID saja'],a:2},
    {q:'Access point berfungsi untuk?',opts:['Menghubungkan perangkat nirkabel ke jaringan kabel','Memotong kabel fiber','Mengatur VLAN saja','Menyimpan halaman login hotspot'],a:0},
    {q:'Interferensi sinyal wireless sering disebabkan oleh?',opts:['Perangkat elektronik lain & channel yang tumpang tindih','Kabel UTP yang panjang','VLAN ID yang salah','Warna casing router'],a:0},
    {q:'Frekuensi yang umum digunakan wireless rumahan/sekolah adalah?',opts:['2.4GHz dan 5GHz','56kHz','100MHz','1GHz'],a:0},
    {q:'Fitur Hotspot pada Mikrotik memungkinkan pengguna untuk?',opts:['Login melalui halaman web sebelum akses internet','Langsung akses tanpa autentikasi','Mengubah firmware router','Membuat VLAN otomatis'],a:0},

let state = {
  view:'dashboard',
  materiCat:'jaringan',
  extra:[],
  progress:{},
  scores:{},

async function loadStorage(){
  try{ const ex = await window.storage.get('materi-tambahan', true); state.extra = ex ? JSON.parse(ex.value) : []; }catch(e){ state.extra = []; }
  try{ const pr = await window.storage.get('progress', false); state.progress = pr ? JSON.parse(pr.value) : {}; }catch(e){ state.progress = {}; }
  try{ const sc = await window.storage.get('quiz-scores', false); state.scores = sc ? JSON.parse(sc.value) : {}; }catch(e){ state.scores = {}; }
  try{ const lk = await window.storage.get('materi-links', true); state.links = lk ? JSON.parse(lk.value) : {}; }catch(e){ state.links = {}; }
}
async function saveExtra(){ try{ await window.storage.set('materi-tambahan', JSON.stringify(state.extra), true); }catch(e){} }
async function saveProgress(){ try{ await window.storage.set('progress', JSON.stringify(state.progress), false); }catch(e){} }
async function saveScores(){ try{ await window.storage.set('quiz-scores', JSON.stringify(state.scores), false); }catch(e){} }
async function saveLinks(){ try{ await window.storage.set('materi-links', JSON.stringify(state.links), true); }catch(e){} }

function allMaterials(){ return MATERIALS.concat(state.extra); }
function materialLink(m){ return state.links[m.id] || m.link || ''; }
async function setMaterialLink(id){
  const current = state.links[id] || (allMaterials().find(x=>x.id===id)||{}).link || '';
  const url = window.prompt('Tempel link Google Drive (atau link lain) untuk materi ini:', current);
  if(url===null) return;
  const trimmed = url.trim();
  if(trimmed){ state.links[id] = trimmed; } else { delete state.links[id]; }
  await saveLinks();
  render();
}
function materialsByCat(cat){ return allMaterials().filter(m=>m.cat===cat); }
function laneProgress(cat){
  const items = materialsByCat(cat);
  if(!items.length) return 0;
  const done = items.filter(m=>state.progress[m.id]).length;
  return Math.round(done/items.length*100);
}
function overallProgress(){
  const items = allMaterials();
  if(!items.length) return 0;
  const done = items.filter(m=>state.progress[m.id]).length;
  return Math.round(done/items.length*100);
}

/* ===================== RENDER: DASHBOARD ===================== */
function renderDashboard(){
  const pct = overallProgress();
  return `
  <div class="hero">
    <div>
      <div class="eyebrow">Peta Belajar</div>
      <h1>Teknologi Jaringan Kabel &amp; Nirkabel</h1>
      <p>Ikuti jalur belajar Jaringan, Fiber Optik, dan Server. Setiap simpul mewakili satu materi — tandai selesai setelah kamu memahaminya.</p>
    </div>
    <div class="ring-wrap">
      <div class="num mono" style="color:var(--jaringan)">${pct}%</div>
      <div class="lbl">progres keseluruhan dari ${allMaterials().length} materi</div>
    </div>
  </div>
  ${Object.keys(CATS).map(catKey=>renderLane(catKey)).join('')}
  `;
}

function renderLane(catKey){
  const cat = CATS[catKey];
  const items = materialsByCat(catKey);
  const pct = laneProgress(catKey);
  const nodes = items.map((m,i)=>{
    const done = !!state.progress[m.id];
    return `
    <button class="node ${done?'done':''}" onclick="openNode('${m.id}')" title="${escapeHtml(m.title)}">
      <div class="node-circle" style="${done?`background:${cat.color};border-color:${cat.color};box-shadow:0 0 14px ${cat.color}55;`:''}">
        ${done? checkIcon() : (i+1)}
      </div>
      <div class="node-label">${escapeHtml(m.title)}</div>
    </button>`;
  }).join('');
  return `
  <section class="lane">
    <div class="lane-head">
      <div class="lane-title">
        <div class="lane-icon" style="background:${cat.dim}">${cat.icon(cat.color)}</div>
        <div>
          <h3>${cat.name}</h3>
          <div class="sub">${cat.desc}</div>
        </div>
      </div>
      <div class="lane-pct">${pct}% selesai · ${items.length} materi</div>
    </div>
    <div class="track">
      <div class="track-line"></div>
      <div class="nodes">${nodes}</div>
    </div>
  </section>`;
}
function checkIcon(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#04131a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

function renderCard(m,i,cat){
  const done = !!state.progress[m.id];
  const isExtra = m.id.startsWith('x');
  const link = materialLink(m);
  return `
  <div class="card" style="--pc:${cat.color}">
    <div class="card-top">
      <span class="card-num">${isExtra? '＋' : String(i+1).padStart(2,'0')}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
        ${link? '<span class="badge-file">🔗 Link</span>' : ''}
        ${done? '<span class="badge-done">Selesai</span>' : (isExtra? '<span class="badge-extra">Tambahan</span>' : '')}
      </div>
    </div>
    <h4>${escapeHtml(m.title)}</h4>
    <p>${escapeHtml(m.desc||'')}</p>
    <div class="card-actions">
      <button class="btn primary sm" style="--pc:${cat.color}" onclick="openNode('${m.id}')">Lihat Materi</button>
      ${link
        ? `<a class="btn sm ghost" href="${escapeAttr(link)}" target="_blank" rel="noopener">Buka Materi ↗</a>`
        : `<button class="btn sm ghost" onclick="setMaterialLink('${m.id}')">+ Tambah Link Drive</button>`}
    </div>
  </div>`;
}

async function submitUpload(){
  const cat = document.getElementById('up-cat').value;
  const title = document.getElementById('up-title').value.trim();
  const desc = document.getElementById('up-desc').value.trim();
  const link = document.getElementById('up-link').value.trim();
  if(!title){ alert('Judul materi wajib diisi.'); return; }
  const btn = document.getElementById('up-submit-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  const id = 'x' + Date.now();
  state.extra.push({id,cat,title,desc});
  await saveExtra();
  if(link){ state.links[id] = link; await saveLinks(); }
  state.showUploadForm=false;
  state.materiCat=cat;
  render();
}

/* ===================== MODAL ===================== */
function openNode(id){ state.modalNode=id; render(); }
function closeModal(){ state.modalNode=null; render(); }

function renderModal(){
  const m = allMaterials().find(x=>x.id===state.modalNode);
  if(!m) return '';
  const cat = CATS[m.cat];
  const done = !!state.progress[m.id];
  const link = materialLink(m);
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-top">
        <span class="card-num" style="border-color:${cat.color};color:${cat.color}">${cat.name}</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <h3>${escapeHtml(m.title)}</h3>
      <p class="desc">${escapeHtml(m.desc||'Belum ada deskripsi untuk materi ini.')}</p>

      <div class="file-box">
        ${link? `
          <div class="file-info">
            <span class="fname">🔗 Materi tertaut</span>
            <a class="btn sm" href="${escapeAttr(link)}" target="_blank" rel="noopener">Buka ↗</a>
          </div>
          <div style="margin-top:10px;">
            <button class="btn sm ghost" onclick="setMaterialLink('${m.id}')">Ubah Link</button>
          </div>
        ` : `
          <div class="file-empty">Belum ada link materi (PPT/PDF di Google Drive) untuk topik ini.</div>
          <button class="btn sm" onclick="setMaterialLink('${m.id}')">+ Tambah Link Drive</button>
        `}
      </div>

      <div class="modal-actions">
        <button class="btn ${done?'':'primary'}" style="--pc:${cat.color}" onclick="toggleDone('${m.id}')">
          ${done? '✓ Sudah selesai — tandai ulang' : 'Tandai Selesai'}
        </button>
        <button class="btn ghost" onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </div>`;
}

async function toggleDone(id){
  state.progress[id] = !state.progress[id];
  await saveProgress();
  render();
}

/* ===================== KUIS ===================== */
function renderKuis(){
  if(state.quizCat && state.quizAnswers.length < QUIZ[state.quizCat].length) return renderQuizRun();
  if(state.quizCat && state.quizAnswers.length === QUIZ[state.quizCat].length) return renderQuizResult();
  return renderQuizPicker();
}

function renderQuizPicker(){
  return `
  <div class="eyebrow">Kuis</div>
  <h1 style="font-size:26px;margin-top:4px;margin-bottom:20px;">Uji pemahamanmu</h1>
  <div class="quiz-cards">
    ${Object.keys(CATS).map(k=>{
      const c = CATS[k];
      const n = QUIZ[k].length;
      const sc = state.scores[k];
      const pct = sc? Math.round(sc.correct/sc.total*100) : null;
      return `
      <div class="qcard">
        <div class="lane-icon" style="background:${c.dim}">${c.icon(c.color)}</div>
        <h4>${c.name}</h4>
        <div class="score">${n} soal ${sc? `· terakhir ${pct}%`:'· belum dicoba'}</div>
        ${sc? `<div class="progressbar"><div style="width:${pct}%;background:${c.color}"></div></div>`:''}
        <button class="btn primary block" style="--pc:${c.color}" onclick="startQuiz('${k}')">${sc?'Coba Lagi':'Mulai Kuis'}</button>
      </div>`;
    }).join('')}
  </div>`;
}

function startQuiz(cat){
  state.quizCat=cat; state.quizIdx=0; state.quizAnswers=[]; state.quizPicked=null; render();
}

function renderQuizRun(){
  const cat = CATS[state.quizCat];
  const qs = QUIZ[state.quizCat];
  const q = qs[state.quizIdx];
  const picked = state.quizPicked;
  return `
  <div class="quiz-run">
    <div class="quiz-meta">
      <span class="eyebrow" style="color:${cat.color}">${cat.name}</span>
      <span class="mono" style="color:var(--text-muted);font-size:12.5px">Soal ${state.quizIdx+1} / ${qs.length}</span>
    </div>
    <div class="qtext">${escapeHtml(q.q)}</div>
    <div class="options">
      ${q.opts.map((o,i)=>{
        let cls='opt';
        if(picked!==null){
          if(i===q.a) cls+=' correct';
          else if(i===picked) cls+=' wrong';
        }
        return `<button class="${cls}" ${picked!==null?'disabled':''} onclick="pickAnswer(${i})">
          <span class="k">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</button>`;
      }).join('')}
    </div>
    ${picked!==null? `<button class="btn primary" style="--pc:${cat.color}" onclick="nextQuestion()">${state.quizIdx+1<qs.length?'Soal Berikutnya':'Lihat Hasil'}</button>` : ''}
  </div>`;
}

function pickAnswer(i){
  if(state.quizPicked!==null) return;
  state.quizPicked=i;
  render();
}
async function nextQuestion(){
  const q = QUIZ[state.quizCat][state.quizIdx];
  state.quizAnswers.push(state.quizPicked===q.a);
  state.quizIdx++;
  state.quizPicked=null;
  if(state.quizAnswers.length === QUIZ[state.quizCat].length){
    const correct = state.quizAnswers.filter(Boolean).length;
    state.scores[state.quizCat] = {correct, total: state.quizAnswers.length, date: new Date().toISOString()};
    await saveScores();
  }
  render();
}

function renderQuizResult(){
  const cat = CATS[state.quizCat];
  const correct = state.quizAnswers.filter(Boolean).length;
  const total = state.quizAnswers.length;
  const pct = Math.round(correct/total*100);
  return `
  <div class="quiz-run">
    <div class="result-hero">
      <div class="eyebrow" style="color:${cat.color}">${cat.name} · Hasil Kuis</div>
      <div class="big mono">${correct}/${total}</div>
      <p>Kamu menjawab benar ${pct}% dari soal ${cat.name.toLowerCase()}.</p>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn primary" style="--pc:${cat.color}" onclick="startQuiz('${state.quizCat}')">Coba Lagi</button>
      <button class="btn ghost" onclick="state.quizCat=null;render()">Pilih Kategori Lain</button>
      <button class="btn ghost" onclick="setView('dashboard')">Kembali ke Dashboard</button>
    </div>
  </div>`;
}

/* ===================== UTIL ===================== */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ===================== ROOT RENDER ===================== */
function render(){
  renderNav();
  const app = document.getElementById('app');
  if(state.view==='dashboard') app.innerHTML = renderDashboard();
  else if(state.view==='materi') app.innerHTML = renderMateri();
  else if(state.view==='kuis') app.innerHTML = renderKuis();
}

(async function init(){
  document.getElementById('app').innerHTML = '<div class="empty">Memuat peta belajar…</div>';
  await loadStorage();
  render();
})();
</script>
</body>
</html>
